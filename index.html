<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEKICS Marketing Strategy CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --text:#192238;--muted:#778197;--line:rgba(69,79,112,.10);
  --primary:#3973f6;--primary-soft:#eaf1ff;--purple:#8069e8;--pink:#db91b7;
  --green:#16a34a;--green-soft:#e7f7ee;--amber:#d97706;--amber-soft:#fff4e0;--red:#e0475b;--red-soft:#fdecef;
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.74);
  --shadow:0 18px 48px rgba(54,49,85,.07),inset 0 1px 0 rgba(255,255,255,.5);
  --r-lg:24px;--r-md:16px;--r-sm:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#f8f6fb}
body{font-family:"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:14px;line-height:1.55;min-height:100vh;
  background:
    radial-gradient(ellipse 60% 52% at -4% -7%,rgba(255,185,214,.62),transparent 66%),
    radial-gradient(ellipse 58% 48% at 103% 3%,rgba(211,198,255,.62),transparent 65%),
    radial-gradient(ellipse 55% 44% at 53% 17%,rgba(196,229,255,.45),transparent 68%),
    radial-gradient(ellipse 48% 40% at 90% 77%,rgba(232,211,255,.32),transparent 70%),
    linear-gradient(150deg,#fff9fc 0%,#f8f4ff 44%,#f1f8fc 100%);background-attachment:fixed}
.num,.kpi-value,.big{font-family:Inter,"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  background:rgba(255,255,255,.42);border-right:1px solid rgba(255,255,255,.62);backdrop-filter:blur(34px) saturate(1.24);-webkit-backdrop-filter:blur(34px) saturate(1.24)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:Inter;font-size:15px;
  background:linear-gradient(145deg,#3973f6,#8069e8 62%,#db91b7);box-shadow:0 11px 28px rgba(77,91,180,.22)}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand small{color:var(--muted);font-size:11.5px}
.nav-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:#4a5469;font-weight:600;border:1px solid transparent;background:none;text-align:left;width:100%;font-size:13.5px;transition:.18s}
.nav-item:hover{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.5)}
.nav-item.active{background:rgba(255,255,255,.72);color:var(--primary);border-color:rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(54,49,85,.065)}
.nav-item .ico{width:22px;text-align:center;font-size:15px}
.nav-item .tag{margin-left:auto;font-size:10.5px;background:var(--primary-soft);color:var(--primary);padding:1px 7px;border-radius:20px}
.side-foot{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);font-size:12px;color:var(--muted)}
.side-foot b{color:var(--text);display:block;margin-bottom:3px}
.main{padding:24px 30px 60px;min-width:0}
.topbar{position:sticky;top:12px;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;margin-bottom:22px;border-radius:20px;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);box-shadow:0 16px 44px rgba(54,49,85,.055);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px)}
.topbar h1{font-size:19px;letter-spacing:-.4px}
.topbar .sub{color:var(--muted);font-size:12.5px}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sample{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:4px 10px;border-radius:20px}
.btn{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.7);padding:8px 14px;border-radius:11px;font-weight:600;font-size:12.5px;color:#34405a;transition:.15s}
.btn:hover{background:#fff}
.btn.primary{background:linear-gradient(135deg,#3973f6,#6a6cf0);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(57,115,246,.25)}
.btn.sm{padding:5px 10px;font-size:12px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--glass);border:1px solid rgba(255,255,255,.72);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 22px;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.card h3{font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card .card-sub{color:var(--muted);font-size:12px;margin-top:2px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-73{grid-template-columns:1.55fr 1fr}
.mt{margin-top:16px}
.kpi{padding:18px 20px}
.kpi-label{color:var(--muted);font-size:12px;font-weight:600}
.kpi-value{font-size:27px;font-weight:800;letter-spacing:-.8px;margin-top:4px}
.kpi-value small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi-foot{font-size:12px;margin-top:6px;color:var(--muted)}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-blue{background:var(--primary-soft);color:var(--primary)}.p-green{background:var(--green-soft);color:var(--green)}
.p-amber{background:var(--amber-soft);color:var(--amber)}.p-red{background:var(--red-soft);color:var(--red)}
.p-purple{background:#f1edff;color:var(--purple)}.p-gray{background:#eef0f4;color:#5f6880}
.bar{height:8px;border-radius:10px;background:rgba(69,79,112,.08);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:linear-gradient(90deg,#3973f6,#8069e8)}
.bar.green>i{background:linear-gradient(90deg,#22c55e,#16a34a)}.bar.amber>i{background:linear-gradient(90deg,#fbbf24,#d97706)}.bar.red>i{background:linear-gradient(90deg,#fb7185,#e0475b)}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr.click{cursor:pointer;transition:.12s}tr.click:hover td{background:rgba(255,255,255,.55)}
.flag{font-size:18px;margin-right:6px}
.muted{color:var(--muted)}
.stage-dots{display:flex;gap:4px}
.stage-dots i{width:22px;height:6px;border-radius:6px;background:rgba(69,79,112,.12)}
.stage-dots i.on{background:linear-gradient(90deg,#3973f6,#8069e8)}

/* country view */
.country-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.c-list{padding:10px;position:sticky;top:96px}
.c-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;cursor:pointer;border:1px solid transparent}
.c-item:hover{background:rgba(255,255,255,.5)}
.c-item.active{background:#fff;border-color:rgba(57,115,246,.2);box-shadow:0 6px 18px rgba(57,115,246,.10)}
.c-item .flag{font-size:22px;margin:0}
.c-item b{font-size:13.5px;display:block}
.c-item small{color:var(--muted);font-size:11.5px}
.c-item .rate{margin-left:auto;font-family:Inter;font-weight:800;font-size:13px}
.hero{display:flex;align-items:center;gap:18px;padding:22px 24px}
.hero .flag{font-size:44px;margin:0}
.hero h2{font-size:23px;letter-spacing:-.5px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hero .hero-kpis{margin-left:auto;display:flex;gap:26px;text-align:right}
.hero-kpis div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.hero-kpis div b{font-family:Inter;font-size:21px;font-weight:800}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tab{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.45);padding:9px 15px;border-radius:12px;font-weight:700;font-size:13px;color:#5a6479}
.tab .n{font-family:Inter;color:var(--muted);margin-right:5px}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 8px 20px rgba(57,115,246,.12)}
.tab.active .n{color:var(--primary)}
.panel{display:none}.panel.active{display:block;animation:fade .2s}
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.env{padding:16px;border-radius:var(--r-md);background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8)}
.env .k{font-size:11.5px;font-weight:700;color:var(--purple);letter-spacing:.3px}
.env .v{font-weight:700;margin:4px 0 4px;font-size:14px}
.env p{font-size:12.5px;color:#5a6479}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
.flow b{color:var(--text);background:rgba(255,255,255,.7);padding:4px 10px;border-radius:9px}
.flow .arr{color:#b3b9c8}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.step{padding:18px;border-radius:var(--r-md);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);position:relative}
.step.now{background:#fff;border-color:rgba(57,115,246,.35);box-shadow:0 12px 28px rgba(57,115,246,.12)}
.step .s-no{font-family:Inter;font-weight:800;font-size:12px;color:var(--primary)}
.step h4{font-size:15px;margin:2px 0 6px}
.step ul{padding-left:16px;font-size:12.5px;color:#4a5469}
.step ul li{margin:3px 0}
.step .when{font-size:11.5px;color:var(--muted);margin-top:8px}
.approach{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.approach .env .v{font-size:13.5px}
.funnel{display:flex;flex-direction:column;gap:8px}
.f-row{display:grid;grid-template-columns:70px 1fr 50px;align-items:center;gap:10px;font-size:12.5px}
.f-row .fb{height:26px;border-radius:9px;background:linear-gradient(90deg,#3973f6,#8069e8);display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;font-size:12px;font-family:Inter}
.effort{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.effort .env{text-align:center}
.effort .big{font-size:24px;font-weight:800}
.ring{display:flex;align-items:center;gap:18px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* product view */
.prod-tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.prod-tab{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);text-align:left;min-width:210px}
.prod-tab .pi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,#eaf1ff,#f1edff)}
.prod-tab b{display:block;font-size:14px}.prod-tab small{color:var(--muted);font-size:11.5px}
.prod-tab.active{background:#fff;box-shadow:0 10px 26px rgba(57,115,246,.13);border-color:rgba(57,115,246,.25)}
.lifecycle{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lc-col{border-radius:var(--r-lg);padding:16px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.75);min-height:200px}
.lc-col.cur{background:rgba(255,255,255,.72);box-shadow:0 14px 34px rgba(57,115,246,.10);border-color:rgba(57,115,246,.25)}
.lc-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lc-head .no{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-family:Inter;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(145deg,#3973f6,#8069e8)}
.lc-head b{font-size:15px}
.lc-head .pill{margin-left:auto}
.lc-card{background:#fff;border-radius:13px;padding:12px 13px;margin-bottom:9px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(54,49,85,.04)}
.lc-card .t{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.lc-card p{font-size:12px;color:#5f6880;margin-top:4px}
.lc-card .files{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.file{font-size:11px;padding:3px 8px;border-radius:7px;background:#f4f6fa;color:#4a5469;font-weight:600}
.cmp td:first-child{font-weight:700;color:#4a5469;width:150px}
.cmp th.us,.cmp td.us{background:rgba(57,115,246,.06)}
.cmp th.us{color:var(--primary)}
.win{color:var(--green);font-weight:800}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:15px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.85)}
.doc .di{width:40px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;font-family:Inter}
.doc b{font-size:13px;display:block}
.doc small{color:var(--muted);font-size:11.5px}

/* partners & activity */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:8px 11px;border-radius:10px;border:1px solid rgba(69,79,112,.14);background:rgba(255,255,255,.8);outline:none}
.toolbar input{min-width:220px}
.chip{border:1px solid rgba(69,79,112,.12);background:rgba(255,255,255,.65);padding:6px 12px;border-radius:20px;font-weight:600;font-size:12px;color:#4a5469}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(#c9d6ff,#e8dcff)}
.tl{position:relative;margin-bottom:12px}
.tl .dot{position:absolute;left:-26px;top:16px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#fff;border:2px solid #c9d6ff}
.tl .card{padding:14px 18px}
.tl .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .row .date{margin-left:auto;font-family:Inter;color:var(--muted);font-size:12px;font-weight:600}
.tl p{font-size:12.5px;color:#4a5469;margin-top:6px}
.tl .res{margin-top:8px;font-size:12px;padding:8px 11px;border-radius:10px;background:var(--green-soft);color:#166534}
.upcoming .u{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.upcoming .u:last-child{border:0}
.u .d{width:46px;text-align:center;border-radius:12px;background:#fff;padding:5px 0;box-shadow:0 4px 12px rgba(54,49,85,.06)}
.u .d b{display:block;font-family:Inter;font-size:17px;line-height:1.1}
.u .d small{font-size:10px;color:var(--muted);font-weight:700}
.u .info b{font-size:13px}.u .info small{display:block;color:var(--muted);font-size:11.5px}
.u .pill{margin-left:auto}

/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(25,34,56,.22);backdrop-filter:blur(3px);z-index:50;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;background:rgba(255,255,255,.94);z-index:60;box-shadow:-20px 0 60px rgba(54,49,85,.15);
  transform:translateX(105%);transition:.28s ease;padding:24px;overflow:auto}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:18px;top:16px;border:0;background:#f1f3f7;width:32px;height:32px;border-radius:10px;font-size:16px}
.drawer h2{font-size:20px;letter-spacing:-.4px;margin:4px 0 6px}
.dl{display:grid;grid-template-columns:100px 1fr;gap:9px 12px;font-size:13px;margin:16px 0}
.dl dt{color:var(--muted);font-weight:600}
.form{display:grid;gap:10px;margin-top:14px}
.form label{font-size:12px;font-weight:700;color:#4a5469;display:grid;gap:5px}
.form input,.form select,.form textarea{padding:9px 11px;border-radius:10px;border:1px solid rgba(69,79,112,.16);background:#fff;outline:none}
.form textarea{min-height:80px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
svg text{font-family:Inter,"Noto Sans KR",sans-serif}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g-73,.g3{grid-template-columns:1fr}.hero{flex-wrap:wrap}.hero .hero-kpis{margin-left:0}}
@media (max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
  .brand,.nav-label,.side-foot{display:none}.nav-item{width:auto}.main{padding:16px}.country-layout{grid-template-columns:1fr}.c-list{position:relative;top:0}
  .steps,.approach,.lifecycle,.effort,.g2{grid-template-columns:1fr}}

/* ===== product-first additions ===== */
.prod-nav{display:flex;flex-direction:column;gap:4px}
.prod-nav .nav-item .pi{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:linear-gradient(145deg,#eaf1ff,#f1edff)}
.p-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.p-hero .card{padding:22px 24px}
.p-title{display:flex;align-items:center;gap:14px}
.p-title .pi{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#eaf1ff,#f1edff);box-shadow:inset 0 1px 0 #fff}
.p-title h2{font-size:24px;letter-spacing:-.6px}
.p-title .model{color:var(--muted);font-size:12.5px}
.usp{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.usp span{font-size:12px;font-weight:700;padding:6px 11px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.lc-track{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.lc-step{padding:12px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85)}
.lc-step.on{background:#fff;border-color:rgba(57,115,246,.35);box-shadow:0 10px 24px rgba(57,115,246,.12)}
.lc-step.done{background:var(--green-soft)}
.lc-step b{font-size:13px;display:block}.lc-step small{font-size:11.5px;color:var(--muted)}
.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.mini-kpis div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.6)}
.mini-kpis span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.mini-kpis b{font-family:Inter;font-size:19px;font-weight:800}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-title h3{font-size:17px;letter-spacing:-.3px}
.sec-title .no{font-family:Inter;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(145deg,#3973f6,#8069e8);padding:3px 9px;border-radius:8px}
.sec-title .sub{color:var(--muted);font-size:12.5px}
.sec-title .right{margin-left:auto;display:flex;gap:8px}
/* sheet */
.sheet-wrap{overflow:auto;border-radius:18px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.72);box-shadow:var(--shadow);max-height:560px}
.sheet{border-collapse:separate;border-spacing:0;min-width:1500px;font-size:12.5px}
.sheet th{position:sticky;top:0;z-index:2;background:#f5f7fb;color:#4a5469;font-size:11.5px;padding:0;border-bottom:1px solid #e3e7ef;border-right:1px solid #eceff5;white-space:nowrap}
.sheet th .grp{display:block;padding:6px 10px;font-size:10.5px;color:#fff;letter-spacing:.3px}
.sheet th .col{display:block;padding:8px 10px}
.sheet td{padding:10px;border-bottom:1px solid #eef1f6;border-right:1px solid #f1f3f8;vertical-align:top;background:rgba(255,255,255,.55);max-width:220px}
.sheet tr:hover td{background:#fff}
.sheet td:first-child,.sheet th:first-child{position:sticky;left:0;z-index:3;background:#fff;box-shadow:2px 0 0 #eceff5}
.sheet th:first-child{z-index:4;background:#f5f7fb}
.sheet .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .t1{font-weight:700;color:var(--text)}
.sheet .t2{color:#6b7489;font-size:11.5px;margin-top:2px}
.g-a{background:#6c7cf5}.g-b{background:#8b6cf0}.g-c{background:#16a37f}.g-d{background:#e08a2b}
.goal-chain{display:flex;flex-direction:column;gap:3px}
.goal-chain span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:#f2f4f8;color:#6b7489}
.goal-chain span.now{background:var(--primary-soft);color:var(--primary);font-weight:700}
.goal-chain span.done{background:var(--green-soft);color:var(--green)}
/* materials */
.mat-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mat{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(54,49,85,.04);transition:.15s}
.mat:hover{background:#fff;transform:translateY(-1px);box-shadow:0 12px 26px rgba(54,49,85,.08)}
.mat .di{width:42px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;font-family:Inter}
.mat .info{min-width:0;flex:1}
.mat .info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat .info small{color:var(--muted);font-size:11.5px}
.mat .langs{display:flex;gap:4px;margin-top:5px}
.mat .langs i{font-style:normal;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#eef1f7;color:#5f6880}
.mat .dl-btn{border:0;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;white-space:nowrap;text-decoration:none}
.gsrc{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.gsrc i{width:8px;height:8px;border-radius:50%;background:#16a34a;display:inline-block}
.overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ov-card{cursor:pointer;transition:.18s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 22px 50px rgba(54,49,85,.10)}
@media (max-width:1180px){.p-hero,.overview-grid{grid-template-columns:1fr}.mini-kpis{grid-template-columns:repeat(2,1fr)}}

/* single-line text */
.sheet td{white-space:nowrap;max-width:none}
.sheet .clamp{display:block;-webkit-line-clamp:unset;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-chain span{white-space:nowrap}
.lc-step b,.lc-step small,.p-title .model,.mat .info small,.kpi-label,.card-sub,.sec-title .sub,.u .info small,.u .info b,.prod-tab small,.env .v,.usp span,.pill{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-step small{display:block}
